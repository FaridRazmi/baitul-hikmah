<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home – Baitul Hikmah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/navbar.css" />
    <link rel="stylesheet" href="../../shared/footer.css" />
    <link rel="stylesheet" href="home.css" />

    <script src="https://unpkg.com/feather-icons"></script>
    <script src="../../shared/components.js"></script>
  </head>
  <body>
    <!-- navbar -->
    <div id="navbar-placeholder"></div>

    <div class="hero">
      <h1>Welcome to Baitul Hikmah</h1>
      <p>
        Your digital house of wisdom. Discover, explore, and borrow books from
        our curated collection.
      </p>
      <a
        href="../catalogue/catalogue.html"
        class="hero-btn"
        onclick="return confirmCatalogue();"
        >Browse Catalogue</a
      >

      <script>
        function confirmCatalogue() {
          return window.confirm(
            "Reminder ! you are borrowing a physical book.",
          );
          // OK = pergi catalogue, Cancel = stay kat page
        }
      </script>
    </div>
    <!-- Map & Grayscale Section -->
    <div class="map-section">
      <div class="button-row">
        <button onclick="toggleMap()" id="map-btn">📍 View Location</button>
        <button id="grey-btn" onclick="toggleGrayscale()">Grayscale</button>
      </div>

      <!-- Map Container - hidden by default -->
      <div id="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3981.392520428242!2d103.05703997310187!3d3.7242866493519275!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31c8cd3c201f6e7d%3A0x1cb18a28171e00a!2sDarul%20Hikmah(CFS%20Library)!5e0!3m2!1sen!2smy!4v1778834037026!5m2!1sen!2smy"
          width="100%"
          height="350"
          style="border: 0; display: block"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>
      </div>
    </div>
    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <script src="../../shared/grayscale.js"></script>
    <script>
      renderNavbar([
        { label: 'Home', href: 'home.html' },
        { label: 'About Us', href: '../about/about.html' }
      ]);
      renderFooter();
      feather.replace();
    </script>
    <script src="home.js"></script>
  </body>
</html>
